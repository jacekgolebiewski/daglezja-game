<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #e0e0e0;
    }

    h1 {
      font-size: 2.5rem;
      letter-spacing: 0.2em;
      color: #4ade80;
      text-shadow: 0 0 20px #4ade8088;
      margin-bottom: 0.5rem;
    }

    #scoreboard {
      display: flex;
      gap: 2rem;
      margin-bottom: 1rem;
      font-size: 1rem;
      color: #a0a0c0;
    }

    #scoreboard span {
      font-weight: bold;
      color: #fff;
    }

    canvas {
      border: 2px solid #4ade8044;
      border-radius: 8px;
      box-shadow: 0 0 40px #4ade8022;
      background: #12121f;
    }

    #message {
      margin-top: 1.2rem;
      font-size: 1.1rem;
      color: #a0a0c0;
      min-height: 1.5em;
      text-align: center;
    }

    #message strong {
      color: #4ade80;
    }

    #controls {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #555577;
      text-align: center;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="scoreboard">
    Score: <span id="score">0</span>
    &nbsp;|&nbsp;
    Best: <span id="best">0</span>
  </div>
  <canvas id="canvas" width="400" height="400"></canvas>
  <div id="message">Press <strong>Space</strong> or tap to start</div>
  <div id="controls">
    Arrow keys / WASD to move &nbsp;|&nbsp; Space to pause<br>
    Mobile: swipe to steer
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const msgEl = document.getElementById('message');

    const GRID = 20;
    const COLS = canvas.width / GRID;
    const ROWS = canvas.height / GRID;

    const COLORS = {
      head: '#4ade80',
      body: '#22c55e',
      bodyFade: '#166534',
      food: '#f87171',
      foodGlow: '#f8717188',
      grid: '#ffffff08',
    };

    let snake, dir, nextDir, food, score, best, state, animId, lastTime, speed;

    function init() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 },
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      speed = 150;
      lastTime = 0;
      placeFood();
      scoreEl.textContent = 0;
    }

    function placeFood() {
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function update(ts) {
      animId = requestAnimationFrame(update);
      if (ts - lastTime < speed) return;
      lastTime = ts;

      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        return gameOver();
      }
      // Self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
        }
        speed = Math.max(60, 150 - score * 3);
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Grid
      ctx.strokeStyle = COLORS.grid;
      ctx.lineWidth = 0.5;
      for (let x = 0; x <= canvas.width; x += GRID) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y <= canvas.height; y += GRID) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Food with glow
      ctx.save();
      ctx.shadowColor = COLORS.foodGlow;
      ctx.shadowBlur = 12;
      ctx.fillStyle = COLORS.food;
      const pad = 3;
      const r = GRID / 2 - pad;
      const fx = food.x * GRID + GRID / 2;
      const fy = food.y * GRID + GRID / 2;
      ctx.beginPath();
      ctx.arc(fx, fy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Snake
      snake.forEach((seg, i) => {
        const t = i / snake.length;
        ctx.fillStyle = i === 0
          ? COLORS.head
          : lerpColor(COLORS.body, COLORS.bodyFade, t);
        const x = seg.x * GRID + 1;
        const y = seg.y * GRID + 1;
        const sz = GRID - 2;
        roundRect(ctx, x, y, sz, sz, 4);
        ctx.fill();
      });

      // Eyes on head
      const hx = snake[0].x * GRID;
      const hy = snake[0].y * GRID;
      ctx.fillStyle = '#0f0f1a';
      const eyeOffset = dir.y === 0 ? [4, 5] : [5, 4];
      const eyeShift = dir.x === 1 ? 12 : dir.x === -1 ? 3 : 7;
      const eyeRow = dir.y === 1 ? 12 : dir.y === -1 ? 3 : 7;
      ctx.beginPath();
      ctx.arc(hx + eyeShift - eyeOffset[0] + eyeOffset[0], hy + eyeRow - eyeOffset[1] + eyeOffset[1] - 2, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(hx + eyeShift + eyeOffset[0], hy + eyeRow + eyeOffset[1] - 2, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function lerpColor(a, b, t) {
      const ah = parseInt(a.slice(1), 16);
      const bh = parseInt(b.slice(1), 16);
      const ar = (ah >> 16) & 0xff, ag = (ah >> 8) & 0xff, ab = ah & 0xff;
      const br = (bh >> 16) & 0xff, bg = (bh >> 8) & 0xff, bb = bh & 0xff;
      const rr = Math.round(ar + (br - ar) * t);
      const rg = Math.round(ag + (bg - ag) * t);
      const rb = Math.round(ab + (bb - ab) * t);
      return `rgb(${rr},${rg},${rb})`;
    }

    function gameOver() {
      cancelAnimationFrame(animId);
      state = 'over';
      flashGameOver();
      msgEl.innerHTML = `Game Over! Score: <strong>${score}</strong> &mdash; Space to restart`;
    }

    function flashGameOver() {
      let count = 0;
      const id = setInterval(() => {
        ctx.fillStyle = `rgba(248,113,113,${0.15})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (++count > 4) clearInterval(id);
      }, 80);
    }

    function startGame() {
      if (animId) cancelAnimationFrame(animId);
      init();
      state = 'running';
      msgEl.innerHTML = '';
      animId = requestAnimationFrame(update);
    }

    function handleKey(e) {
      if (state !== 'running' && (e.code === 'Space' || e.key === ' ')) {
        startGame(); return;
      }
      if (e.code === 'Space' && state === 'running') {
        togglePause(); return;
      }
      const map = {
        ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 }, S: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 }, D: { x: 1, y: 0 },
      };
      const nd = map[e.key];
      if (nd && !(nd.x === -dir.x && nd.y === -dir.y)) {
        nextDir = nd;
        e.preventDefault();
      }
    }

    function togglePause() {
      if (state === 'running') {
        cancelAnimationFrame(animId);
        state = 'paused';
        msgEl.innerHTML = 'Paused &mdash; Space to resume';
      } else if (state === 'paused') {
        state = 'running';
        msgEl.innerHTML = '';
        lastTime = 0;
        animId = requestAnimationFrame(update);
      }
    }

    // Touch / swipe support
    let touchStart = null;
    canvas.addEventListener('touchstart', e => {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });
    canvas.addEventListener('touchend', e => {
      if (!touchStart) return;
      if (state !== 'running') { startGame(); return; }
      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;
      if (Math.abs(dx) > Math.abs(dy)) {
        const nd = dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 };
        if (!(nd.x === -dir.x)) nextDir = nd;
      } else {
        const nd = dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 };
        if (!(nd.y === -dir.y)) nextDir = nd;
      }
      touchStart = null;
    }, { passive: true });

    document.addEventListener('keydown', handleKey);

    // Initial draw
    state = 'idle';
    init();
    draw();
  </script>
</body>
</html>
