<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Block Runner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; overflow: hidden; touch-action: none; user-select: none; }
    canvas { display: block; position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d');

// ── Characters (swap these out to customise — images/avatars to be added externally) ──
const CHARACTERS = [
  { name: 'Rex',    color: '#22c55e', moods: { default: '🦕', happy: '🥳', angry: '🦖' } },
  { name: 'R0B0',   color: '#60a5fa', moods: { default: '🤖', happy: '🤩', angry: '💢' } },
  { name: 'Merlin', color: '#c084fc', moods: { default: '🧙', happy: '✨', angry: '🤬' } },
];

// ── Funny questions ───────────────────────────────────────────────────────────
const QUESTIONS = [
  { text: "What's 1 + 1?",         answers: ["2, duh!",          "Uh... window?"],    correct: 0, happyLine: "GENIUS!! I knew I liked you!",      wrongLine: "IT'S TWO!! HOW?! HOW DID YOU..." },
  { text: "Hot dog = sandwich?",   answers: ["Yes. Obviously.",   "Never. Not ever."], correct: 0, happyLine: "Science agrees. You pass.",          wrongLine: "BREAD+FILLING=SANDWICH. AAAARGH!" },
  { text: "What moves faster?",    answers: ["Light, duh.",       "My grandma lol"],   correct: 0, happyLine: "Phew. I was worried for a sec.",     wrongLine: "YOUR GRANDMA CANNOT WIN PHYSICS!!" },
  { text: "Is this game too hard?",answers: ["A little... yes.",  "I EAT HARD GAMES!"],correct: 1, happyLine: "That's the spirit! Respect!",       wrongLine: "Said it's hard = penalty time >:)" },
  { text: "Best gaming snack?",    answers: ["Chips!",            "Celery sticks??"],  correct: 0, happyLine: "Correct. Celery cannot be trusted.", wrongLine: "CELERY?! IN THIS ECONOMY?!"        },
  { text: "Sides on a square?",    answers: ["4, obviously",      "It's a circle??"],  correct: 0, happyLine: "You are so smart I could CRY.",      wrongLine: "SQUARE ≠ CIRCLE. I QUIT."          },
  { text: "Best time to game?",    answers: ["Always. 24/7.",     "Maybe not 3AM..."], correct: 0, happyLine: "Absolutely CORRECT! Legend!",        wrongLine: "3 AM IS PEAK GAMING TIME!! WRONG!" },
  { text: "Cats or dogs?",         answers: ["DOGS!",             "Cats..."],          correct: 0, happyLine: "Dogs!! Yes!! CORRECT!!",             wrongLine: "CATS DON'T EVEN CARE ABOUT YOU!"   },
];

// ── Constants ───────────────────────────────────────────────────────────────
const B             = 40;    // block size px
const GRAVITY       = 2400;  // px/s²
const JUMP_VY       = -680;  // px/s  (negative = upward)
const FLOAT_GRAV    = 0.38;  // gravity multiplier while holding & ascending
const PLAYER_SCR_X  = 130;   // fixed screen X of player
const SPEED_START   = 320;   // px/s
const SPEED_MAX     = 850;   // px/s
const SPEED_STEP    = 30;    // added each interval
const SPEED_INT          = 5;    // seconds between speed bumps
const DIALOGUE_FIRST     = 80;   // blocks until first encounter
const DIALOGUE_INTERVAL  = 450;  // blocks between subsequent encounters

// ── Globals ─────────────────────────────────────────────────────────────────
let W, H;
let state;           // 'cover' | 'avatar_select' | 'playing' | 'dead'
let player, cameraX, platforms;
let speed, speedTimer, score, best;
let holding, lastTime;
let genX, genLastY, genLastRight;
let playerCharIdx;        // index into CHARACTERS; set on avatar select
let avatarHoverIdx;       // card the pointer is hovering over
let dlg;                  // active dialogue state object (null when idle)
let dlgBtns;              // [{x,y,w,h,idx}] hit areas, rebuilt each draw frame
let nextDialogueTrigger;  // score at which next dialogue fires
let screenShake;          // pixels of camera shake; decays each frame

best                = 0;
playerCharIdx       = -1;
avatarHoverIdx      = -1;
dlg                 = null;
dlgBtns             = [];
screenShake         = 0;

// ── Resize / orientation ─────────────────────────────────────────────────────
function resize() {
  const sw = window.innerWidth, sh = window.innerHeight;
  if (sw < sh) {
    // Portrait: render at landscape dimensions and rotate 90° CW to fill screen
    W = C.width  = sh;
    H = C.height = sw;
    C.style.transform = 'rotate(90deg) translateY(-100%)';
  } else {
    W = C.width  = sw;
    H = C.height = sh;
    C.style.transform = '';
  }
}

// Convert pointer (screen) coords → game (canvas) coords
function toGame(sx, sy) {
  if (window.innerHeight > window.innerWidth) {
    // Canvas is rotated 90° CW: screen(sx,sy) → game(sy, innerWidth-sx)
    return [sy, window.innerWidth - sx];
  }
  return [sx, sy];
}

window.addEventListener('resize', resize);
resize();

// ── Init / reset game ────────────────────────────────────────────────────────
function init() {
  speed                = SPEED_START;
  speedTimer           = 0;
  score                = 0;
  cameraX              = 0;
  holding              = false;
  platforms            = [];
  dlg                  = null;
  dlgBtns              = [];
  screenShake          = 0;
  nextDialogueTrigger  = DIALOGUE_FIRST;

  const groundY     = H - B * 3;
  const groundWidth = Math.ceil(W / B) + 4;  // 1 screen of safe ground

  platforms.push({ wx: 0, y: groundY, wb: groundWidth });
  genX        = groundWidth * B;
  genLastY    = groundY;
  genLastRight = genX;

  player = {
    wx: cameraX + PLAYER_SCR_X,
    y:  groundY - (B - 6),   // feet on ground
    vy: 0,
    w:  B - 6,
    h:  B - 6,
    onGround: true,
  };

  // Pre-generate platforms ahead
  while (genX < cameraX + W * 5) genNext();
}

// ── Procedural platform generation ──────────────────────────────────────────
function genNext() {
  const gapB = 2 + Math.floor(Math.random() * 3);           // gap: 2–4 blocks
  const widB = 3 + Math.floor(Math.random() * 5);           // width: 3–7 blocks
  const dyB  = Math.floor(Math.random() * 5) - 2;           // Δheight: –2..+2 blocks
  const minY = H - B * 9;
  const maxY = H - B * 3;
  const newY = Math.max(minY, Math.min(maxY, genLastY + dyB * B));
  const startX = genLastRight + gapB * B;

  platforms.push({ wx: startX, y: newY, wb: widB });
  genLastRight = startX + widB * B;
  genLastY     = newY;
  genX         = genLastRight;
}

// ── Dialogue system ───────────────────────────────────────────────────────────
function triggerDialogue() {
  // Pick one of the two characters that isn't the player
  const pool    = [0, 1, 2].filter(i => i !== playerCharIdx);
  const charIdx = pool[Math.floor(Math.random() * pool.length)];
  const question = QUESTIONS[Math.floor(Math.random() * QUESTIONS.length)];
  const panelH  = Math.max(260, Math.min(Math.round(H * 0.43), 295));

  dlg = {
    phase:          'entering',
    charIdx,
    question,
    panelH,
    panelY:         H,     // starts off-screen below; slides up
    typeIdx:        0,
    typeTimer:      0,
    selectedAnswer: -1,
    reactTimer:     0,
    // animation
    charBounce:     0,     // vertical offset for happy bounce
    charBounceV:    0,     // bounce velocity
    shakeX:         0,     // horizontal offset for angry shake
    shakeTimer:     0,     // drives sin oscillation
    stars:          [],    // confetti particles on correct answer
  };
  dlgBtns = [];
  state   = 'dialogue';
}

function updateDialogue(dt) {
  const targetY = H - dlg.panelH;

  if (dlg.phase === 'entering') {
    dlg.panelY += (targetY - dlg.panelY) * Math.min(1, dt * 14);
    if (Math.abs(dlg.panelY - targetY) < 1) {
      dlg.panelY = targetY;
      dlg.phase  = 'typing';
    }

  } else if (dlg.phase === 'typing') {
    dlg.typeTimer += dt;
    const full = dlg.question.text.length;
    dlg.typeIdx = Math.min(full, Math.floor(dlg.typeTimer * 32));
    if (dlg.typeIdx >= full) dlg.phase = 'choices';

  } else if (dlg.phase === 'reacting') {
    dlg.reactTimer += dt;

    // Happy bounce physics
    if (dlg.charBounce < 0 || dlg.charBounceV < 0) {
      dlg.charBounceV += 1500 * dt;
      dlg.charBounce  += dlg.charBounceV * dt;
      if (dlg.charBounce >= 0) {
        dlg.charBounce  = 0;
        dlg.charBounceV = dlg.charBounceV < -40 ? dlg.charBounceV * -0.42 : 0;
      }
    }

    // Angry rage-wobble
    const isWrong = dlg.selectedAnswer !== dlg.question.correct;
    if (isWrong) {
      dlg.shakeTimer += dt;
      const decay = Math.max(0, 1 - dlg.reactTimer / 1.6);
      dlg.shakeX = Math.sin(dlg.shakeTimer * 46) * decay * 15;
    }

    // Star particles
    for (const s of dlg.stars) {
      s.x    += s.vx * dt;
      s.y    += s.vy * dt;
      s.vy   += 400 * dt;
      s.life -= dt;
    }
    dlg.stars = dlg.stars.filter(s => s.life > 0);

    if (dlg.reactTimer >= 2.2) dlg.phase = 'leaving';

  } else if (dlg.phase === 'leaving') {
    dlg.panelY += (H + 20 - dlg.panelY) * Math.min(1, dt * 12);
    if (dlg.panelY >= H + 10) {
      state = 'playing';
      dlg   = null;
    }
  }
}

function answerDialogue(idx) {
  if (!dlg || dlg.phase !== 'choices') return;
  dlg.selectedAnswer = idx;
  dlg.phase          = 'reacting';
  dlg.reactTimer     = 0;

  if (idx === dlg.question.correct) {
    // Happy: launch character upward
    dlg.charBounceV = -420;
    // Burst of confetti from the character area
    const cx = W / 2, cy = dlg.panelY + 46;
    const colours = ['#fbbf24', '#a3e635', '#22d3ee', '#f472b6', '#c084fc', '#fb923c'];
    for (let i = 0; i < 26; i++) {
      dlg.stars.push({
        x:    cx + (Math.random() - 0.5) * 70,
        y:    cy + (Math.random() - 0.5) * 24,
        vx:   (Math.random() - 0.5) * 240,
        vy:   -160 - Math.random() * 180,
        life: 0.9 + Math.random() * 0.5,
        color: colours[Math.floor(Math.random() * colours.length)],
        size:  3 + Math.random() * 4,
      });
    }
  } else {
    // Angry: screen shake + character rage-wobble
    screenShake = 18;
  }
}

// ── Update ───────────────────────────────────────────────────────────────────
function update(dt) {
  // Speed ramp
  speedTimer += dt;
  if (speedTimer >= SPEED_INT) {
    speedTimer -= SPEED_INT;
    speed = Math.min(SPEED_MAX, speed + SPEED_STEP);
  }

  // Auto-scroll camera; player follows at fixed screen X
  cameraX  += speed * dt;
  player.wx = cameraX + PLAYER_SCR_X;

  // Vertical physics
  const gMult = (holding && player.vy < 0) ? FLOAT_GRAV : 1;
  player.vy   = Math.min(player.vy + GRAVITY * gMult * dt, 1400);

  const prevBottom = player.y + player.h;
  player.y        += player.vy * dt;
  const curBottom  = player.y + player.h;

  // Platform collision (top landing only)
  player.onGround = false;
  for (const p of platforms) {
    if (player.wx + player.w <= p.wx || player.wx >= p.wx + p.wb * B) continue;
    const pTop = p.y;
    if (player.vy >= 0 && prevBottom <= pTop + 2 && curBottom >= pTop) {
      player.y        = pTop - player.h;
      player.vy       = 0;
      player.onGround = true;
      break;
    }
  }

  // Score = blocks traveled
  score = Math.floor(cameraX / B);
  if (score > best) best = score;

  // Death: fell below screen
  if (player.y > H + B * 3) {
    state = 'dead';
  }

  // Dialogue encounter trigger
  if (score >= nextDialogueTrigger) {
    nextDialogueTrigger = score + DIALOGUE_INTERVAL;
    triggerDialogue();
    return;
  }

  // Generate ahead & cull old platforms
  while (genX < cameraX + W * 5) genNext();
  platforms = platforms.filter(p => p.wx + p.wb * B > cameraX - B * 2);
}

// ── Draw ─────────────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, W, H);

  if (state !== 'cover' && state !== 'avatar_select') {
    if (screenShake > 0) {
      ctx.save();
      ctx.translate(
        (Math.random() * 2 - 1) * screenShake,
        (Math.random() * 2 - 1) * screenShake * 0.5
      );
    }
    drawPlatforms();
    drawPlayer();
    drawHUD();
    if (screenShake > 0) ctx.restore();
  }

  if (state === 'cover')         drawCover();
  if (state === 'avatar_select') drawAvatarSelect();
  if (state === 'dead')          drawDead();
  if (state === 'dialogue')      drawDialogue();
}

function drawPlatforms() {
  ctx.strokeStyle = '#888888';
  ctx.lineWidth   = 2;
  for (const p of platforms) {
    const sx = p.wx - cameraX;
    for (let i = 0; i < p.wb; i++) {
      const bx = sx + i * B;
      if (bx + B < -B || bx > W + B) continue;
      ctx.strokeRect(bx + 1, p.y + 1, B - 2, B - 2);
    }
  }
}

function drawPlayer() {
  const sx   = player.wx - cameraX;
  const char = playerCharIdx >= 0 ? CHARACTERS[playerCharIdx] : null;
  // Body — use chosen character colour, fallback green
  ctx.fillStyle = char ? char.color : '#4ade80';
  ctx.fillRect(sx, player.y, player.w, player.h);
  // Eyes (right-facing)
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(sx + player.w - 11, player.y + 6,  5, 4);
  ctx.fillRect(sx + player.w - 11, player.y + 15, 5, 4);
}

function drawHUD() {
  // Score badge
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  roundRect(W - 140, 12, 128, 34, 6);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font      = 'bold 22px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(score + 'm', W - 16, 37);

  // Speed bar (bottom left)
  const pct = (speed - SPEED_START) / (SPEED_MAX - SPEED_START);
  const barW = 120, barH = 8, bx = 16, by = H - 28;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(bx - 2, by - 2, barW + 4, barH + 4);
  ctx.fillStyle = pct > 0.7 ? '#f87171' : pct > 0.35 ? '#fbbf24' : '#4ade80';
  ctx.fillRect(bx, by, barW * pct, barH);
  ctx.strokeStyle = '#444';
  ctx.lineWidth   = 1;
  ctx.strokeRect(bx, by, barW, barH);
  ctx.fillStyle  = '#666';
  ctx.font       = '11px monospace';
  ctx.textAlign  = 'left';
  ctx.fillText('SPEED', bx, by - 6);
}

function drawCover() {
  // Dark overlay
  ctx.fillStyle = 'rgba(10,10,20,0.94)';
  ctx.fillRect(0, 0, W, H);

  // Decorative blocks in background
  ctx.strokeStyle = 'rgba(100,100,140,0.18)';
  ctx.lineWidth = 2;
  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < Math.ceil(W / B) + 1; col++) {
      ctx.strokeRect(col * B + (row % 2) * (B / 2), H * 0.72 + row * B, B - 3, B - 3);
    }
  }

  // Title
  const titleSize = Math.min(62, W * 0.13);
  ctx.fillStyle = '#4ade80';
  ctx.font      = `bold ${titleSize}px monospace`;
  ctx.textAlign = 'center';
  ctx.shadowColor = '#4ade8066';
  ctx.shadowBlur  = 24;
  ctx.fillText('BLOCK RUNNER', W / 2, H * 0.34);
  ctx.shadowBlur = 0;

  // Subtitle
  ctx.fillStyle = '#ffffff';
  ctx.font      = `bold ${Math.min(26, W * 0.065)}px monospace`;
  ctx.fillText('TAP TO PLAY', W / 2, H * 0.50);

  ctx.fillStyle = '#555577';
  ctx.font      = `${Math.min(15, W * 0.038)}px monospace`;
  ctx.fillText('tap & hold = float higher', W / 2, H * 0.60);

  if (best > 0) {
    ctx.fillStyle = '#fbbf24';
    ctx.font      = `${Math.min(18, W * 0.045)}px monospace`;
    ctx.fillText('best  ' + best + 'm', W / 2, H * 0.69);
  }
}

// Returns card layout constants (shared between draw & hit-test)
function cardLayout() {
  const cardW  = Math.min(130, (W - 80) / 3.4);
  const cardH  = cardW * 1.55;
  const gap    = Math.min(20, (W - cardW * 3 - 60) / 2);
  const totalW = cardW * 3 + gap * 2;
  const startX = (W - totalW) / 2;
  const cardY  = H * 0.33;
  return { cardW, cardH, gap, startX, cardY };
}

function getCardAtPoint(px, py) {
  const { cardW, cardH, gap, startX, cardY } = cardLayout();
  for (let i = 0; i < 3; i++) {
    const cx = startX + i * (cardW + gap);
    if (px >= cx && px <= cx + cardW && py >= cardY && py <= cardY + cardH) return i;
  }
  return -1;
}

function drawAvatarSelect() {
  const { cardW, cardH, gap, startX, cardY } = cardLayout();

  ctx.fillStyle = 'rgba(10,10,20,0.97)';
  ctx.fillRect(0, 0, W, H);

  // Title
  ctx.fillStyle = '#ffffff';
  ctx.font      = `bold ${Math.min(28, W * 0.068)}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('CHOOSE YOUR CHARACTER', W / 2, H * 0.17);

  ctx.fillStyle = '#555577';
  ctx.font      = `${Math.min(12, W * 0.032)}px monospace`;
  ctx.fillText("your pick won't show up to bother you", W / 2, H * 0.24);

  for (let i = 0; i < 3; i++) {
    const ch      = CHARACTERS[i];
    const cx      = startX + i * (cardW + gap);
    const isHover = avatarHoverIdx === i;

    // Card bg
    ctx.fillStyle = isHover ? ch.color + '22' : 'rgba(255,255,255,0.04)';
    roundRect(cx, cardY, cardW, cardH, 14);
    ctx.fill();

    // Card border
    ctx.strokeStyle = isHover ? ch.color : 'rgba(255,255,255,0.12)';
    ctx.lineWidth   = isHover ? 2.5 : 1.5;
    roundRect(cx, cardY, cardW, cardH, 14);
    ctx.stroke();

    // Emoji
    const emojiSz = Math.min(48, cardW * 0.52);
    ctx.font      = `${emojiSz}px serif`;
    ctx.textAlign = 'center';
    ctx.fillText(ch.moods.default, cx + cardW / 2, cardY + cardH * 0.42);

    // Name
    ctx.fillStyle = isHover ? ch.color : '#cccccc';
    ctx.font      = `bold ${Math.min(15, cardW * 0.155)}px monospace`;
    ctx.fillText(ch.name, cx + cardW / 2, cardY + cardH * 0.68);

    // Tap hint
    ctx.fillStyle = isHover ? ch.color : '#33334a';
    ctx.font      = `${Math.min(10, cardW * 0.11)}px monospace`;
    ctx.fillText('TAP TO PLAY', cx + cardW / 2, cardY + cardH * 0.87);
  }
}

function wrapText(text, cx, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '', lineY = y;
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, cx, lineY);
      line  = word;
      lineY += lineH;
    } else {
      line = test;
    }
  }
  ctx.fillText(line, cx, lineY);
}

function drawDialogue() {
  if (!dlg) return;
  const ch  = CHARACTERS[dlg.charIdx];
  const py  = Math.round(dlg.panelY);
  const ph  = dlg.panelH;
  const q   = dlg.question;

  // Dim the game world above
  ctx.fillStyle = 'rgba(0,0,10,0.55)';
  ctx.fillRect(0, 0, W, py);

  // Panel background
  ctx.fillStyle = '#12121f';
  ctx.fillRect(0, py, W, ph + 4);

  // Coloured top border strip
  ctx.fillStyle = ch.color;
  ctx.fillRect(0, py, W, 4);

  // ── Star particles (drawn before panel so they appear over the game) ──
  for (const s of dlg.stars) {
    ctx.globalAlpha = Math.max(0, Math.min(1, s.life * 1.4));
    ctx.fillStyle   = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ── Character ──
  const moodKey  = dlg.phase === 'reacting'
    ? (dlg.selectedAnswer === q.correct ? 'happy' : 'angry')
    : 'default';
  const emojiSz  = Math.min(52, W * 0.12);
  const emojiCY  = py + 46;
  const nameY    = py + 70;
  const ex       = W / 2 + dlg.shakeX;
  const ey       = emojiCY + dlg.charBounce;
  ctx.font       = `${emojiSz}px serif`;
  ctx.textAlign  = 'center';
  ctx.fillText(ch.moods[moodKey] || ch.moods.default, ex, ey);

  ctx.fillStyle  = ch.color;
  ctx.font       = `bold ${Math.min(13, W * 0.034)}px monospace`;
  ctx.fillText(ch.name.toUpperCase(), ex, nameY);

  // ── Speech bubble ──
  const btnH      = 48;
  const btnTop    = py + ph - 74;
  const bubbleTop = py + 84;
  const bubbleH   = btnTop - bubbleTop - 12;
  const bubbleW   = Math.min(W - 48, 480);
  const bubbleX   = (W - bubbleW) / 2;

  // Determine displayed text
  let speechText, speechColor;
  if (dlg.phase === 'reacting') {
    const correct = dlg.selectedAnswer === q.correct;
    speechText  = correct ? q.happyLine : q.wrongLine;
    speechColor = correct ? '#4ade80' : '#f87171';
  } else {
    speechText  = q.text.slice(0, dlg.typeIdx) + (dlg.typeIdx < q.text.length ? '▌' : '');
    speechColor = '#ffffff';
  }

  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  roundRect(bubbleX, bubbleTop, bubbleW, bubbleH, 10);
  ctx.fill();

  ctx.fillStyle  = speechColor;
  ctx.font       = `bold ${Math.min(15, W * 0.038)}px monospace`;
  ctx.textAlign  = 'center';
  wrapText(speechText, W / 2, bubbleTop + 24, bubbleW - 28, Math.min(20, W * 0.05));

  // ── Answer buttons ──
  dlgBtns = [];
  if (dlg.phase === 'choices' || dlg.phase === 'reacting') {
    const totalBW = Math.min(W - 48, 480);
    const btnW    = (totalBW - 12) / 2;
    const b0x     = (W - totalBW) / 2;
    const b1x     = b0x + btnW + 12;

    for (let i = 0; i < 2; i++) {
      const bx  = i === 0 ? b0x : b1x;
      let bg, border, text;

      if (dlg.phase === 'reacting') {
        const isCorrect = i === q.correct;
        const isPicked  = i === dlg.selectedAnswer;
        bg     = isPicked ? (isCorrect ? '#0a3d1e' : '#3d0a0a') : 'rgba(255,255,255,0.04)';
        border = isCorrect ? '#4ade80' : '#f87171';
        text   = isCorrect ? '#4ade80' : '#f87171';
      } else {
        bg = 'rgba(255,255,255,0.07)'; border = 'rgba(255,255,255,0.22)'; text = '#ffffff';
      }

      ctx.fillStyle   = bg;
      roundRect(bx, btnTop, btnW, btnH, 9);
      ctx.fill();
      ctx.strokeStyle = border;
      ctx.lineWidth   = 1.5;
      roundRect(bx, btnTop, btnW, btnH, 9);
      ctx.stroke();

      // Truncate label to fit
      ctx.font = `bold ${Math.min(13, W * 0.034)}px monospace`;
      let label = q.answers[i];
      while (ctx.measureText(label).width > btnW - 20 && label.length > 3)
        label = label.slice(0, -1);
      if (label !== q.answers[i]) label += '…';

      ctx.fillStyle  = text;
      ctx.textAlign  = 'center';
      ctx.fillText(label, bx + btnW / 2, btnTop + btnH / 2 + 5);

      if (dlg.phase === 'choices') dlgBtns.push({ x: bx, y: btnTop, w: btnW, h: btnH, idx: i });
    }
  }
}

function drawDead() {
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, 0, W, H);

  const isNewBest = score > 0 && score >= best;

  ctx.fillStyle = '#f87171';
  ctx.font      = `bold ${Math.min(54, W * 0.12)}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', W / 2, H * 0.36);

  ctx.fillStyle = '#ffffff';
  ctx.font      = `bold ${Math.min(42, W * 0.1)}px monospace`;
  ctx.fillText(score + 'm', W / 2, H * 0.50);

  if (isNewBest) {
    ctx.fillStyle = '#fbbf24';
    ctx.font      = `bold ${Math.min(20, W * 0.05)}px monospace`;
    ctx.fillText('NEW BEST!', W / 2, H * 0.60);
  }

  ctx.fillStyle = '#aaaaaa';
  ctx.font      = `${Math.min(22, W * 0.055)}px monospace`;
  ctx.fillText('TAP TO RETRY', W / 2, isNewBest ? H * 0.71 : H * 0.63);
}

// ── Utility ───────────────────────────────────────────────────────────────────
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ── Input ────────────────────────────────────────────────────────────────────
function press(px, py) {
  holding = true;

  if (state === 'cover') {
    state = 'avatar_select';
    return;
  }

  if (state === 'avatar_select') {
    const idx = getCardAtPoint(px, py);
    if (idx >= 0) {
      playerCharIdx = idx;
      init();
      state    = 'playing';
      lastTime = 0;
    }
    return;
  }

  if (state === 'dialogue') {
    if (dlg.phase === 'typing') {
      // Skip typewriter — jump to choices immediately
      dlg.typeIdx = dlg.question.text.length;
      dlg.phase   = 'choices';
      return;
    }
    if (dlg.phase === 'choices') {
      for (const btn of dlgBtns) {
        if (px >= btn.x && px <= btn.x + btn.w && py >= btn.y && py <= btn.y + btn.h) {
          answerDialogue(btn.idx);
          return;
        }
      }
    }
    return;
  }

  if (state === 'dead') {
    init();
    state    = 'playing';
    lastTime = 0;
    return;
  }

  if (state === 'playing' && player.onGround) {
    player.vy       = JUMP_VY;
    player.onGround = false;
  }
}
function release() { holding = false; }

C.addEventListener('pointerdown', e => { e.preventDefault(); const [gx,gy] = toGame(e.clientX, e.clientY); press(gx, gy); }, { passive: false });
C.addEventListener('pointermove',  e => { if (state === 'avatar_select') { const [gx,gy] = toGame(e.clientX, e.clientY); avatarHoverIdx = getCardAtPoint(gx, gy); } });
C.addEventListener('pointerup',     release);
C.addEventListener('pointercancel', release);

document.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); press(-1, -1); }
});
document.addEventListener('keyup', e => {
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) release();
});

// ── Loop ─────────────────────────────────────────────────────────────────────
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = lastTime === 0 ? 0 : Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  if (state === 'playing')  update(dt);
  if (state === 'dialogue') updateDialogue(dt);
  if (screenShake > 0.4) screenShake *= 1 - Math.min(1, dt * 8);
  else                    screenShake = 0;
  draw();
}

// ── Boot ─────────────────────────────────────────────────────────────────────
state    = 'cover';
lastTime = 0;
requestAnimationFrame(loop);
</script>
</body>
