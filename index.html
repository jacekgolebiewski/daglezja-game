<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Block Runner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; overflow: hidden; touch-action: none; user-select: none; }
    canvas { display: block; position: absolute; top: 0; left: 0; transform-origin: 0 0; }

  </style>
</head>
<body>
<canvas id="c"></canvas>


<script>
const C = document.getElementById('c');
const ctx = C.getContext('2d');

// ── Characters ────────────────────────────────────────────────────────────────
const VERSION = 'v0.1.2';

// imgs / _imgData populated at runtime from localStorage or Google Drive
const CHARACTERS = [
  { name: 'Rex',    color: '#22c55e', moods: { default: '🦕', happy: '🥳', angry: '🦖', sad: '😢' }, imgs: {}, _imgData: {}, interactions: [] },
  { name: 'R0B0',   color: '#60a5fa', moods: { default: '🤖', happy: '🤩', angry: '💢', sad: '🔋' }, imgs: {}, _imgData: {}, interactions: [] },
  { name: 'Merlin', color: '#c084fc', moods: { default: '🧙', happy: '✨', angry: '🤬', sad: '😔' }, imgs: {}, _imgData: {}, interactions: [] },
];

// ── Funny questions ───────────────────────────────────────────────────────────
const QUESTIONS = [
  { text: "What's 1 + 1?",         answers: ["2, duh!",          "Uh... window?"],    correct: 0, happyLine: "GENIUS!! I knew I liked you!",      wrongLine: "IT'S TWO!! HOW?! HOW DID YOU..." },
  { text: "Hot dog = sandwich?",   answers: ["Yes. Obviously.",   "Never. Not ever."], correct: 0, happyLine: "Science agrees. You pass.",          wrongLine: "BREAD+FILLING=SANDWICH. AAAARGH!" },
  { text: "What moves faster?",    answers: ["Light, duh.",       "My grandma lol"],   correct: 0, happyLine: "Phew. I was worried for a sec.",     wrongLine: "YOUR GRANDMA CANNOT WIN PHYSICS!!" },
  { text: "Is this game too hard?",answers: ["A little... yes.",  "I EAT HARD GAMES!"],correct: 1, happyLine: "That's the spirit! Respect!",       wrongLine: "Said it's hard = penalty time >:)" },
  { text: "Best gaming snack?",    answers: ["Chips!",            "Celery sticks??"],  correct: 0, happyLine: "Correct. Celery cannot be trusted.", wrongLine: "CELERY?! IN THIS ECONOMY?!"        },
  { text: "Sides on a square?",    answers: ["4, obviously",      "It's a circle??"],  correct: 0, happyLine: "You are so smart I could CRY.",      wrongLine: "SQUARE ≠ CIRCLE. I QUIT."          },
  { text: "Best time to game?",    answers: ["Always. 24/7.",     "Maybe not 3AM..."], correct: 0, happyLine: "Absolutely CORRECT! Legend!",        wrongLine: "3 AM IS PEAK GAMING TIME!! WRONG!" },
  { text: "Cats or dogs?",         answers: ["DOGS!",             "Cats..."],          correct: 0, happyLine: "Dogs!! Yes!! CORRECT!!",             wrongLine: "CATS DON'T EVEN CARE ABOUT YOU!"   },
];

// ── Constants ───────────────────────────────────────────────────────────────
const B             = 36;    // block size px
const GRAVITY       = 2100;  // px/s²
const JUMP_VY       = -600;  // px/s  (negative = upward)
const FLOAT_GRAV    = 0.38;  // gravity multiplier while holding & ascending
const PLAYER_SCR_X  = 130;   // fixed screen X of player
const SPEED_START   = 320;   // px/s
const SPEED_MAX     = 850;   // px/s
const SPEED_STEP    = 20;    // added each interval
const SPEED_INT          = 5;    // seconds between speed bumps
const DIALOGUE_FIRST     = 80;   // blocks until first encounter
const DIALOGUE_INTERVAL  = 450;  // blocks between subsequent encounters

// ── Globals ─────────────────────────────────────────────────────────────────
let W, H;
let state;           // 'cover' | 'avatar_select' | 'playing' | 'dead'
let player, cameraX, platforms;
let speed, speedTimer, score, best;
let holding, lastTime;
let genX, genLastY, genLastRight;
let playerCharIdx;        // index into CHARACTERS; set on avatar select
let avatarHoverIdx;       // card the pointer is hovering over
let dlg;                  // active dialogue state object (null when idle)
let dlgBtns;              // [{x,y,w,h,idx}] hit areas, rebuilt each draw frame
let nextDialogueTrigger;  // score at which next dialogue fires
let screenShake;          // pixels of camera shake; decays each frame
let settingsBtn;          // settings link hit area on cover screen {x,y,w,h}
let playerMoodKey;        // 'default' | 'happy' | 'angry' — current player mood
let playerMoodTimer;      // seconds remaining for current mood flash

best                = 0;
playerCharIdx       = -1;
playerMoodKey       = 'default';
playerMoodTimer     = 0;
avatarHoverIdx      = -1;
dlg                 = null;
dlgBtns             = [];
screenShake         = 0;
settingsBtn         = null;

// ── Resize / orientation ─────────────────────────────────────────────────────
function resize() {
  const sw = window.innerWidth, sh = window.innerHeight;
  if (sw < sh) {
    // Portrait: render at landscape dimensions and rotate 90° CW to fill screen
    W = C.width  = sh;
    H = C.height = sw;
    C.style.transform = 'rotate(90deg) translateY(-100%)';
  } else {
    W = C.width  = sw;
    H = C.height = sh;
    C.style.transform = '';
  }
}

// Convert pointer (screen) coords → game (canvas) coords
function toGame(sx, sy) {
  if (window.innerHeight > window.innerWidth) {
    // Canvas is rotated 90° CW: screen(sx,sy) → game(sy, innerWidth-sx)
    return [sy, window.innerWidth - sx];
  }
  return [sx, sy];
}

window.addEventListener('resize', resize);
resize();

// ── Init / reset game ────────────────────────────────────────────────────────
function init() {
  speed                = SPEED_START;
  speedTimer           = 0;
  score                = 0;
  cameraX              = 0;
  holding              = false;
  platforms            = [];
  dlg                  = null;
  dlgBtns              = [];
  screenShake          = 0;
  nextDialogueTrigger  = DIALOGUE_FIRST;

  const groundY     = H - B;
  const groundWidth = Math.ceil(W / B) + 4;  // 1 screen of safe ground

  platforms.push({ wx: 0, y: groundY, wb: groundWidth });
  genX        = groundWidth * B;
  genLastY    = groundY;
  genLastRight = genX;

  player = {
    wx: cameraX + PLAYER_SCR_X,
    y:  groundY - B,       // feet on ground
    vy: 0,
    w:  B,
    h:  B,
    onGround: true,
  };

  // Pre-generate platforms ahead
  while (genX < cameraX + W * 5) genNext();
}

// ── Procedural platform generation ──────────────────────────────────────────
function genNext() {
  const gapB = 1 + Math.floor(Math.random() * 3);           // gap: 1–3 blocks
  const widB = 4 + Math.floor(Math.random() * 4);           // width: 4–7 blocks
  const dyB  = Math.floor(Math.random() * 5) - 2;           // Δheight: –2..+2 blocks
  const minY = H - B * 8;
  const maxY = H - B;
  const newY = Math.max(minY, Math.min(maxY, genLastY + dyB * B));
  const startX = genLastRight + gapB * B;

  platforms.push({ wx: startX, y: newY, wb: widB });
  genLastRight = startX + widB * B;
  genLastY     = newY;
  genX         = genLastRight;
}

// ── Choice path generation ────────────────────────────────────────────────────
function generateChoicePaths() {
  // Place fork far enough ahead so the player has time to read the dialogue
  const forkX = Math.round((cameraX + W * 1.6) / B) * B;

  // Clear everything pre-generated at or beyond the fork
  platforms = platforms.filter(p => p.wx + p.wb * B <= forkX);

  // Approach platform connecting current terrain to the fork
  const lastEnd = platforms.reduce((mx, p) => Math.max(mx, p.wx + p.wb * B), cameraX);
  if (forkX > lastEnd) {
    platforms.push({ wx: lastEnd, y: H - B * 2, wb: Math.ceil((forkX - lastEnd) / B) });
  }

  const count  = 5;
  const pw     = 4;
  const step   = (pw + 3) * B;
  const upperY = H - B * 5;   // closer to ground so the jump is manageable
  const lowerY = H - B;
  // Randomly swap which path (upper/lower) holds choice 0 vs 1 each time
  const pathFlip = Math.random() < 0.5;

  for (let i = 0; i < count; i++) {
    const x = forkX + i * step;
    platforms.push({ wx: x, y: upperY, wb: pw, choiceIdx: pathFlip ? 1 : 0 });
    platforms.push({ wx: x, y: lowerY, wb: pw, choiceIdx: pathFlip ? 0 : 1 });
  }

  genLastRight = forkX + count * step;
  genLastY     = lowerY;
  genX         = genLastRight;
}

// ── Dialogue system ───────────────────────────────────────────────────────────
function triggerDialogue() {
  const pool    = CHARACTERS.map((_, i) => i).filter(i => i !== playerCharIdx);
  if (!pool.length) return;
  const charIdx = pool[Math.floor(Math.random() * pool.length)];
  const ch      = CHARACTERS[charIdx];

  let question;
  if (ch.interactions && ch.interactions.length > 0) {
    const iact  = ch.interactions[Math.floor(Math.random() * ch.interactions.length)];
    // Randomise which platform (upper=0 / lower=1) holds the correct answer
    const flip  = Math.random() < 0.5;
    question = {
      text:      iact.text,
      answers:   flip ? [iact.correct, iact.wrong] : [iact.wrong, iact.correct],
      correct:   flip ? 0 : 1,
      happyLine: iact.correct,
      wrongLine: iact.wrong,
    };
  } else {
    question = QUESTIONS[Math.floor(Math.random() * QUESTIONS.length)];
  }

  dlg = {
    phase:          'typing',
    charIdx,
    question,
    typeIdx:        0,
    typeTimer:      0,
    selectedAnswer: -1,
    reactTimer:     0,
    charBounce:     0,
    charBounceV:    0,
    shakeX:         0,
    shakeTimer:     0,
    stars:          [],
  };
  generateChoicePaths();
  dlgBtns = [];
  state   = 'dialogue';
}

function updateDialogue(dt) {
  if (dlg.phase === 'typing') {
    dlg.typeTimer += dt;
    const full = dlg.question.text.length;
    dlg.typeIdx = Math.min(full, Math.floor(dlg.typeTimer * 32));
    if (dlg.typeIdx >= full) dlg.phase = 'choices';

  } else if (dlg.phase === 'reacting') {
    dlg.reactTimer += dt;

    if (dlg.charBounce < 0 || dlg.charBounceV < 0) {
      dlg.charBounceV += 1500 * dt;
      dlg.charBounce  += dlg.charBounceV * dt;
      if (dlg.charBounce >= 0) {
        dlg.charBounce  = 0;
        dlg.charBounceV = dlg.charBounceV < -40 ? dlg.charBounceV * -0.42 : 0;
      }
    }

    if (dlg.selectedAnswer !== dlg.question.correct) {
      dlg.shakeTimer += dt;
      dlg.shakeX = Math.sin(dlg.shakeTimer * 46) * Math.max(0, 1 - dlg.reactTimer / 1.6) * 12;
    }

    for (const s of dlg.stars) {
      s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 400 * dt; s.life -= dt;
    }
    dlg.stars = dlg.stars.filter(s => s.life > 0);

    if (dlg.reactTimer >= 2.2) {
      platforms.forEach(p => { delete p.choiceIdx; });
      state = 'playing';
      dlg   = null;
    }
  }
}

function answerDialogue(idx) {
  if (!dlg || dlg.phase !== 'choices') return;
  dlg.selectedAnswer = idx;
  dlg.phase          = 'reacting';
  dlg.reactTimer     = 0;

  if (idx === dlg.question.correct) {
    speed = Math.min(SPEED_MAX, speed + 40);
    // Happy: launch character upward
    dlg.charBounceV = -420;
    // Burst of confetti from the character area
    const cx = 36, cy = 28;   // near top-bar emoji
    const colours = ['#fbbf24', '#a3e635', '#22d3ee', '#f472b6', '#c084fc', '#fb923c'];
    for (let i = 0; i < 26; i++) {
      dlg.stars.push({
        x:    cx + (Math.random() - 0.5) * 70,
        y:    cy + (Math.random() - 0.5) * 24,
        vx:   (Math.random() - 0.5) * 240,
        vy:   -160 - Math.random() * 180,
        life: 0.9 + Math.random() * 0.5,
        color: colours[Math.floor(Math.random() * colours.length)],
        size:  3 + Math.random() * 4,
      });
    }
  } else {
    speed = Math.max(SPEED_START, speed - 30);
    // Angry: screen shake + character rage-wobble
    screenShake = 18;
  }
}

// ── Update ───────────────────────────────────────────────────────────────────
function update(dt) {
  // Player mood flashes — random brief happy/angry moments
  if (playerMoodTimer > 0) {
    playerMoodTimer -= dt;
    if (playerMoodTimer <= 0) playerMoodKey = 'default';
  } else if (Math.random() < 0.004) {   // ~once every 4 s at 60 fps
    playerMoodKey   = Math.random() < 0.5 ? 'happy' : 'angry';
    playerMoodTimer = 0.5;
  }

  // Auto-scroll camera; player follows at fixed screen X
  // Slow scroll during dialogue so player has time to navigate the split path
  const scrollSpeed = (state === 'dialogue') ? speed * 0.65 : speed;
  cameraX  += scrollSpeed * dt;
  player.wx = cameraX + PLAYER_SCR_X;

  // Vertical physics
  const gMult = (holding && player.vy < 0) ? FLOAT_GRAV : 1;
  player.vy   = Math.min(player.vy + GRAVITY * gMult * dt, 1400);

  const prevBottom = player.y + player.h;
  player.y        += player.vy * dt;
  const curBottom  = player.y + player.h;

  // Platform collision (top landing only)
  player.onGround = false;
  for (const p of platforms) {
    if (player.wx + player.w <= p.wx || player.wx >= p.wx + p.wb * B) continue;
    const pTop = p.y;
    if (player.vy >= 0 && prevBottom <= pTop + 2 && curBottom >= pTop) {
      player.y        = pTop - player.h;
      player.vy       = 0;
      player.onGround = true;
      break;
    }
  }

  // Choice-platform landing → auto-answer
  if (dlg && player.onGround && (dlg.phase === 'typing' || dlg.phase === 'choices')) {
    for (const p of platforms) {
      if (p.choiceIdx === undefined) continue;
      if (player.wx + player.w <= p.wx || player.wx >= p.wx + p.wb * B) continue;
      if (Math.abs(player.y + player.h - p.y) < 4) {
        if (dlg.phase !== 'choices') { dlg.typeIdx = dlg.question.text.length; dlg.phase = 'choices'; }
        answerDialogue(p.choiceIdx);
        break;
      }
    }
  }

  // Score = blocks traveled
  score = Math.floor(cameraX / B);
  if (score > best) best = score;

  // Death: fell below screen
  if (player.y > H + B * 3) {
    state = 'dead';
  }

  // Dialogue encounter trigger
  if (score >= nextDialogueTrigger) {
    nextDialogueTrigger = score + DIALOGUE_INTERVAL;
    triggerDialogue();
    return;
  }

  // Generate ahead & cull old platforms
  while (genX < cameraX + W * 5) genNext();
  platforms = platforms.filter(p => p.wx + p.wb * B > cameraX - B * 2);
}

// ── Draw ─────────────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);

  // Background
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, W, H);

  if (state !== 'cover' && state !== 'avatar_select') {
    if (screenShake > 0) {
      ctx.save();
      ctx.translate(
        (Math.random() * 2 - 1) * screenShake,
        (Math.random() * 2 - 1) * screenShake * 0.5
      );
    }
    drawPlatforms();
    drawPlayer();
    drawHUD();
    if (screenShake > 0) ctx.restore();
  }

  if (state === 'cover')         drawCover();
  if (state === 'avatar_select') drawAvatarSelect();
  if (state === 'dead')          drawDead();
  if (state === 'dialogue')      drawDialogue();
}

function drawPlatforms() {
  for (const p of platforms) {
    const sx       = p.wx - cameraX;
    const isChoice = p.choiceIdx !== undefined;
    const color    = isChoice ? (p.choiceIdx === 0 ? '#4ade80' : '#60a5fa') : null;

    ctx.strokeStyle = color || '#888888';
    ctx.lineWidth   = isChoice ? 2.5 : 2;

    for (let i = 0; i < p.wb; i++) {
      const bx = sx + i * B;
      if (bx + B < -B || bx > W + B) continue;
      ctx.strokeRect(bx + 1, p.y + 1, B - 2, B - 2);
    }

    // Answer label above choice platforms (only while question is active)
    if (isChoice && dlg && dlg.question) {
      const platLeft  = sx;
      const platRight = sx + p.wb * B;
      if (platRight > 0 && platLeft < W) {
        const labelX = (Math.max(platLeft, 0) + Math.min(platRight, W)) / 2;
        ctx.fillStyle  = color;
        ctx.font       = `bold ${Math.min(12, W * 0.03)}px monospace`;
        ctx.textAlign  = 'center';
        ctx.fillText(dlg.question.answers[p.choiceIdx] || '', labelX, p.y - 10);
      }
    }
  }
}

function drawPlayer() {
  const sx   = player.wx - cameraX;
  const char = playerCharIdx >= 0 ? CHARACTERS[playerCharIdx] : null;
  const mood = playerMoodKey || 'default';

  // Coloured block body (always drawn as base)
  ctx.fillStyle = char ? char.color : '#4ade80';
  ctx.fillRect(sx, player.y, player.w, player.h);

  const imgObj = char && (char.imgs[mood] || char.imgs.default);
  if (imgObj && imgObj.complete && imgObj.naturalWidth) {
    // Clip image to player rect
    ctx.save();
    roundRect(sx, player.y, player.w, player.h, 3);
    ctx.clip();
    ctx.drawImage(imgObj, sx, player.y, player.w, player.h);
    ctx.restore();
  } else if (char) {
    // Emoji fallback — draw centred on the block
    const emojiSz = Math.floor(player.w * 0.82);
    ctx.font          = `${emojiSz}px serif`;
    ctx.textAlign     = 'center';
    ctx.textBaseline  = 'middle';
    ctx.fillText(char.moods[mood] || char.moods.default,
      sx + player.w / 2, player.y + player.h / 2);
    ctx.textBaseline  = 'alphabetic';
  } else {
    // Default eyes when no character selected
    ctx.fillStyle = '#0f0f1a';
    ctx.fillRect(sx + player.w - 11, player.y + 6,  5, 4);
    ctx.fillRect(sx + player.w - 11, player.y + 15, 5, 4);
  }
}

function drawHUD() {
  // Score badge
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  roundRect(W - 140, 12, 128, 34, 6);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font      = 'bold 22px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(score + 'm', W - 16, 37);

  // Speed bar (top left)
  const pct = (speed - SPEED_START) / (SPEED_MAX - SPEED_START);
  const barW = 100, barH = 6, bx = 8, by = 14;
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(bx - 2, by - 2, barW + 4, barH + 4);
  ctx.fillStyle = pct > 0.7 ? '#f87171' : pct > 0.35 ? '#fbbf24' : '#4ade80';
  ctx.fillRect(bx, by, barW * pct, barH);
  ctx.strokeStyle = '#444';
  ctx.lineWidth   = 1;
  ctx.strokeRect(bx, by, barW, barH);
  ctx.fillStyle  = '#666';
  ctx.font       = '10px monospace';
  ctx.textAlign  = 'left';
  ctx.fillText('SPEED', bx, by - 4);
}

function drawCover() {
  // Dark overlay
  ctx.fillStyle = 'rgba(10,10,20,0.94)';
  ctx.fillRect(0, 0, W, H);

  // Decorative blocks in background
  ctx.strokeStyle = 'rgba(100,100,140,0.18)';
  ctx.lineWidth = 2;
  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < Math.ceil(W / B) + 1; col++) {
      ctx.strokeRect(col * B + (row % 2) * (B / 2), H * 0.72 + row * B, B - 3, B - 3);
    }
  }

  // Title
  const titleSize = Math.min(62, W * 0.13);
  ctx.fillStyle = '#4ade80';
  ctx.font      = `bold ${titleSize}px monospace`;
  ctx.textAlign = 'center';
  ctx.shadowColor = '#4ade8066';
  ctx.shadowBlur  = 24;
  ctx.fillText('BLOCK RUNNER', W / 2, H * 0.34);
  ctx.shadowBlur = 0;

  // Subtitle
  ctx.fillStyle = '#ffffff';
  ctx.font      = `bold ${Math.min(26, W * 0.065)}px monospace`;
  ctx.fillText('TAP TO PLAY', W / 2, H * 0.50);

  ctx.fillStyle = '#555577';
  ctx.font      = `${Math.min(15, W * 0.038)}px monospace`;
  ctx.fillText('tap & hold = float higher', W / 2, H * 0.60);

  if (best > 0) {
    ctx.fillStyle = '#fbbf24';
    ctx.font      = `${Math.min(18, W * 0.045)}px monospace`;
    ctx.fillText('best  ' + best + 'm', W / 2, H * 0.69);
  }

  // Version (bottom right)
  ctx.fillStyle = '#33334a';
  ctx.font      = `${Math.min(11, W * 0.028)}px monospace`;
  ctx.textAlign = 'right';
  ctx.fillText(VERSION, W - 12, H - 10);

  // Settings link (bottom left)
  const sLinkTxt = '⚙ Settings';
  const sLinkSz  = Math.min(13, W * 0.033);
  ctx.font       = `${sLinkSz}px monospace`;
  ctx.textAlign  = 'left';
  ctx.fillStyle  = '#444466';
  ctx.fillText(sLinkTxt, 12, H - 10);
  const sLinkW   = ctx.measureText(sLinkTxt).width;
  settingsBtn    = { x: 8, y: H - sLinkSz - 18, w: sLinkW + 8, h: sLinkSz + 14 };
}

// Returns card layout constants (shared between draw & hit-test)
function cardLayout() {
  const n     = CHARACTERS.length;
  const cols  = Math.min(3, n);
  const rows  = Math.ceil(n / cols);
  const cardW = Math.min(130, (W - 80) / (cols + 0.4));
  const cardH = cardW * 1.55;
  const gap   = Math.min(20, Math.max(8, (W - cardW * cols - 60) / Math.max(1, cols - 1)));
  const rowGap = cardH * 0.12;
  const totalH = rows * cardH + (rows - 1) * rowGap;
  const cardY  = (H - totalH) / 2 - H * 0.04;
  return { cardW, cardH, gap, cardY, cols, rows, rowGap };
}

function cardPosition(i) {
  const { cardW, cardH, gap, cardY, cols, rows, rowGap } = cardLayout();
  const row  = Math.floor(i / cols);
  const col  = i % cols;
  const n    = CHARACTERS.length;
  // Center last row if it has fewer cards than cols
  const rowCols = (row === rows - 1 && n % cols !== 0) ? n % cols : cols;
  const cx = (W - (rowCols * cardW + Math.max(0, rowCols - 1) * gap)) / 2 + col * (cardW + gap);
  const cy = cardY + row * (cardH + rowGap);
  return { cx, cy, cardW, cardH };
}

function getCardAtPoint(px, py) {
  for (let i = 0; i < CHARACTERS.length; i++) {
    const { cx, cy, cardW, cardH } = cardPosition(i);
    if (px >= cx && px <= cx + cardW && py >= cy && py <= cy + cardH) return i;
  }
  return -1;
}

function drawAvatarSelect() {
  ctx.fillStyle = 'rgba(10,10,20,0.97)';
  ctx.fillRect(0, 0, W, H);

  // Title
  ctx.fillStyle = '#ffffff';
  ctx.font      = `bold ${Math.min(28, W * 0.068)}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('CHOOSE YOUR CHARACTER', W / 2, H * 0.13);

  ctx.fillStyle = '#555577';
  ctx.font      = `${Math.min(12, W * 0.032)}px monospace`;
  ctx.fillText("your pick won't show up to bother you", W / 2, H * 0.20);

  for (let i = 0; i < CHARACTERS.length; i++) {
    const ch      = CHARACTERS[i];
    const { cx, cy, cardW, cardH } = cardPosition(i);
    const isHover = avatarHoverIdx === i;

    // Card bg
    ctx.fillStyle = isHover ? ch.color + '22' : 'rgba(255,255,255,0.04)';
    roundRect(cx, cy, cardW, cardH, 14);
    ctx.fill();

    // Card border
    ctx.strokeStyle = isHover ? ch.color : 'rgba(255,255,255,0.12)';
    ctx.lineWidth   = isHover ? 2.5 : 1.5;
    roundRect(cx, cy, cardW, cardH, 14);
    ctx.stroke();

    // Avatar image or emoji
    const emojiSz = Math.min(48, cardW * 0.52);
    const imgObj  = ch.imgs.default;
    if (imgObj && imgObj.complete && imgObj.naturalWidth) {
      const isz = emojiSz * 1.3;
      const ix  = cx + cardW / 2 - isz / 2;
      const iy  = cy + cardH * 0.13;
      ctx.save();
      roundRect(ix, iy, isz, isz, 8);
      ctx.clip();
      ctx.drawImage(imgObj, ix, iy, isz, isz);
      ctx.restore();
    } else {
      ctx.font      = `${emojiSz}px serif`;
      ctx.textAlign = 'center';
      ctx.fillText(ch.moods.default, cx + cardW / 2, cy + cardH * 0.42);
    }

    // Name
    ctx.fillStyle = isHover ? ch.color : '#cccccc';
    ctx.font      = `bold ${Math.min(15, cardW * 0.155)}px monospace`;
    ctx.fillText(ch.name, cx + cardW / 2, cy + cardH * 0.68);

    // Tap hint
    ctx.fillStyle = isHover ? ch.color : '#33334a';
    ctx.font      = `${Math.min(10, cardW * 0.11)}px monospace`;
    ctx.fillText('TAP TO PLAY', cx + cardW / 2, cy + cardH * 0.87);
  }
}

function wrapText(text, cx, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '', lineY = y;
  for (const word of words) {
    const test = line ? line + ' ' + word : word;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, cx, lineY);
      line  = word;
      lineY += lineH;
    } else {
      line = test;
    }
  }
  ctx.fillText(line, cx, lineY);
}

function drawDialogue() {
  if (!dlg) return;
  const ch  = CHARACTERS[dlg.charIdx];
  const q   = dlg.question;
  const barH = Math.min(52, H * 0.14);

  // Top bar background + colour accent
  ctx.fillStyle = 'rgba(10,10,20,0.86)';
  ctx.fillRect(0, 0, W, barH);
  ctx.fillStyle = ch.color;
  ctx.fillRect(0, barH - 2, W, 2);

  // Character image or emoji (left side)
  const moodKey = dlg.phase === 'reacting'
    ? (dlg.selectedAnswer === q.correct ? 'happy' : 'angry') : 'default';
  const emojiSz = Math.min(34, barH * 0.76);
  const dlgImg  = ch.imgs[moodKey] || ch.imgs.default;
  if (dlgImg && dlgImg.complete && dlgImg.naturalWidth) {
    const ix = 10 + dlg.shakeX;
    const iy = barH / 2 - emojiSz / 2 + dlg.charBounce;
    ctx.save();
    roundRect(ix, iy, emojiSz, emojiSz, 4);
    ctx.clip();
    ctx.drawImage(dlgImg, ix, iy, emojiSz, emojiSz);
    ctx.restore();
  } else {
    ctx.font      = `${emojiSz}px serif`;
    ctx.textAlign = 'left';
    ctx.fillText(ch.moods[moodKey] || ch.moods.default,
      10 + dlg.shakeX, barH * 0.74 + dlg.charBounce);
  }

  // Name tag
  ctx.fillStyle = ch.color;
  ctx.font      = `bold ${Math.min(11, W * 0.028)}px monospace`;
  ctx.fillText(ch.name.toUpperCase(), emojiSz + 18, barH * 0.38);

  // Question / reaction text
  let txt, col;
  if (dlg.phase === 'reacting') {
    const ok = dlg.selectedAnswer === q.correct;
    txt = ok ? q.happyLine : q.wrongLine;
    col = ok ? '#4ade80' : '#f87171';
  } else {
    txt = q.text.slice(0, dlg.typeIdx) + (dlg.typeIdx < q.text.length ? '▌' : '');
    col = '#ffffff';
  }
  ctx.fillStyle = col;
  ctx.font      = `bold ${Math.min(13, W * 0.033)}px monospace`;
  const maxTW   = W - emojiSz - 28;
  let label     = txt;
  while (ctx.measureText(label).width > maxTW && label.length > 4) label = label.slice(0, -1);
  if (label !== txt) label += '…';
  ctx.fillText(label, emojiSz + 18, barH * 0.76);

  // Star particles (confetti)
  for (const s of dlg.stars) {
    ctx.globalAlpha = Math.max(0, Math.min(1, s.life * 1.4));
    ctx.fillStyle   = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  dlgBtns = [];
}

const CHAR_STORAGE_KEY = 'blockrunner_chars_v1';

// ── localStorage persistence ──────────────────────────────────────────────────
function loadCharactersFromStorage() {
  try {
    const raw = localStorage.getItem(CHAR_STORAGE_KEY);
    if (!raw) return;
    const stored = JSON.parse(raw);
    if (!Array.isArray(stored) || stored.length === 0) return;
    CHARACTERS.length = 0;
    stored.forEach(s => {
      const ch = {
        name:         s.name  || 'Character',
        color:        s.color || '#888888',
        moods:        s.moods || { default: '⭐', happy: '🥳', angry: '😤', sad: '😢' },
        imgs:         {},
        _imgData:     {},
        interactions: Array.isArray(s.interactions) ? s.interactions : [],
      };
      ['default','happy','angry','sad'].forEach(mood => {
        if (s.images && s.images[mood]) {
          ch._imgData[mood] = s.images[mood];
          const img = new Image();
          img.src = s.images[mood];
          ch.imgs[mood] = img;
        }
      });
      CHARACTERS.push(ch);
    });
  } catch(e) { /* corrupt storage – ignore */ }
}

function drawDead() {
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0, 0, W, H);

  const isNewBest = score > 0 && score >= best;

  ctx.fillStyle = '#f87171';
  ctx.font      = `bold ${Math.min(54, W * 0.12)}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', W / 2, H * 0.36);

  ctx.fillStyle = '#ffffff';
  ctx.font      = `bold ${Math.min(42, W * 0.1)}px monospace`;
  ctx.fillText(score + 'm', W / 2, H * 0.50);

  if (isNewBest) {
    ctx.fillStyle = '#fbbf24';
    ctx.font      = `bold ${Math.min(20, W * 0.05)}px monospace`;
    ctx.fillText('NEW BEST!', W / 2, H * 0.60);
  }

  ctx.fillStyle = '#aaaaaa';
  ctx.font      = `${Math.min(22, W * 0.055)}px monospace`;
  ctx.fillText('TAP TO RETRY', W / 2, isNewBest ? H * 0.71 : H * 0.63);
}

// ── Utility ───────────────────────────────────────────────────────────────────
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ── Input ────────────────────────────────────────────────────────────────────
function press(px, py) {
  holding = true;

  // Settings link (cover screen only)
  if (state === 'cover' && settingsBtn &&
      px >= settingsBtn.x && px <= settingsBtn.x + settingsBtn.w &&
      py >= settingsBtn.y && py <= settingsBtn.y + settingsBtn.h) {
    window.location.href = 'settings.html';
    return;
  }

  if (state === 'cover') {
    state = 'avatar_select';
    return;
  }

  if (state === 'avatar_select') {
    const idx = getCardAtPoint(px, py);
    if (idx >= 0) {
      playerCharIdx = idx;
      init();
      state    = 'playing';
      lastTime = 0;
    }
    return;
  }

  if (state === 'dialogue') {
    if (dlg.phase === 'typing') {
      dlg.typeIdx = dlg.question.text.length;
      dlg.phase   = 'choices';
    }
    if (player.onGround) {
      player.vy       = JUMP_VY;
      player.onGround = false;
    }
    return;
  }

  if (state === 'dead') {
    init();
    state    = 'playing';
    lastTime = 0;
    return;
  }

  if (state === 'playing' && player.onGround) {
    player.vy       = JUMP_VY;
    player.onGround = false;
  }
}
function release() { holding = false; }

C.addEventListener('pointerdown', e => { e.preventDefault(); const [gx,gy] = toGame(e.clientX, e.clientY); press(gx, gy); }, { passive: false });
C.addEventListener('pointermove',  e => { if (state === 'avatar_select') { const [gx,gy] = toGame(e.clientX, e.clientY); avatarHoverIdx = getCardAtPoint(gx, gy); } });
C.addEventListener('pointerup',     release);
C.addEventListener('pointercancel', release);

document.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); press(-1, -1); }
});
document.addEventListener('keyup', e => {
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) release();
});

// ── Loop ─────────────────────────────────────────────────────────────────────
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = lastTime === 0 ? 0 : Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  if (state === 'playing' || state === 'dialogue') update(dt);
  if (state === 'dialogue') updateDialogue(dt);
  if (screenShake > 0.4) screenShake *= 1 - Math.min(1, dt * 8);
  else                   screenShake = 0;
  draw();
}

// ── Boot ─────────────────────────────────────────────────────────────────────
loadCharactersFromStorage();
state    = 'cover';
lastTime = 0;
requestAnimationFrame(loop);
</script>
